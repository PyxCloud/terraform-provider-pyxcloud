name: ci
on:
  # Local-devops mode: automatic GitHub Actions triggers are disabled.
  # Run pyxflow locally, or dispatch this workflow manually if explicitly approved.
  workflow_dispatch:
jobs:
  check-and-test:
    runs-on:
      - self-hosted
      - pyxflow
      - linux-x64
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          # Runner cache upload stalled after successful tests; keep gate completion bounded.
          cache: false
      - name: verify Terraform installer guards
        run: python3 -m unittest discover -s test -p install_pinned_terraform_test.py -v
      - name: install pinned terraform
        # DEP-01.1: the full-estate validate test skips without a terraform
        # binary on PATH; install a pinned version (checksum-verified) so the
        # test actually runs in CI instead of skipping.
        run: bash .github/scripts/install-pinned-terraform.sh
      - name: build/vet/test
        run: go vet ./... && go test ./...
      - name: build billing signal scanner
        run: go build -o /tmp/pyxcost-scan ./cmd/pyxcost-scan
      - name: billing signal gate
        # Scan the committed ok fixture to validate the gate binary.
        # Replace testdata/billing-ok.json with your real billing snapshot in production.
        run: /tmp/pyxcost-scan -in testdata/billing-ok.json
