# PR gate: compiles + tests the provider on every pull request. This is the
# authoritative check the cheap-actuator pool waits on before auto-merging
# (the actuator host has no toolchain). Check-only — no deploy.
name: pr-check
on:
  pull_request:
    branches: [main]
env:
  # DEP-01.1: pinned terraform so the internal/catalog validate tests execute
  # instead of skipping (they t.Skip when `terraform` is not on PATH).
  # Bump = change both values together. Checksum is the linux_amd64 entry from
  # https://releases.hashicorp.com/terraform/<ver>/terraform_<ver>_SHA256SUMS
  TERRAFORM_VERSION: "1.16.4"
  TERRAFORM_SHA256: "dc94af0eef1147718ad7c8daea792ed199e3e0492eec180d0adafa2a65a879df"
  # Opt-in flag honored by ztf_ssodo_validate_test.go so the full validate
  # surface (not just the LookPath-guarded tests) runs in CI.
  PYX_TF_VALIDATE: "1"
jobs:
  go-check:
    # Self-hosted (pyxflow) — GitHub-hosted runners are blocked when org Actions billing fails.
    runs-on:
      - self-hosted
      - pyxflow
      - linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: install pinned terraform (DEP-01.1)
        run: |
          set -euo pipefail
          curl -sSfL -o "${RUNNER_TEMP}/terraform.zip" \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "${TERRAFORM_SHA256}  ${RUNNER_TEMP}/terraform.zip" | sha256sum --check --strict -
          unzip -o "${RUNNER_TEMP}/terraform.zip" -d "${RUNNER_TEMP}/terraform-bin"
          "${RUNNER_TEMP}/terraform-bin/terraform" version
          echo "${RUNNER_TEMP}/terraform-bin" >> "$GITHUB_PATH"
      - run: go vet ./...
      - run: go test ./...
